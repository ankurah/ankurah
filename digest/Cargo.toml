[package]
name          = "ankurah-digest"
description   = "Additive digests over the leaves of Ankurah's digest trees"
version       = "0.10.0"
edition       = "2021"
license       = "MIT OR Apache-2.0"
documentation = "https://docs.rs/ankurah-digest"
homepage      = "https://github.com/ankurah/ankurah"
repository    = "https://github.com/ankurah/ankurah"

[dependencies]
ankurah-core-types = { path = "../core-types", version = "=0.10.0" }
# No default features: the digests need neither basepoint tables nor zeroizing.
curve25519-dalek = { version = "4.1.3", default-features = false }
sha2             = "0.10.8"
thiserror        = "2"

[dev-dependencies]
criterion = "0.5"
proptest  = { version = "1.11", default-features = false, features = ["std"] }

# harness = false because criterion provides its own harness.
[[bench]]
name    = "digest"
harness = false
