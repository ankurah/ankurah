[package]
name          = "ankurah-storage-sqlite-node"
version       = "0.10.0"
edition       = "2021"
description   = "Ankurah storage engine over Node.js's built-in SQLite, for WASM nodes running in Node"
license       = "MIT OR Apache-2.0"
documentation = "https://docs.rs/ankurah-storage-sqlite-node"
homepage      = "https://github.com/ankurah/ankurah"
repository    = "https://github.com/ankurah/ankurah"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ankurah-core           = { path = "../../core", version = "=0.10.0", features = ["wasm"] }
ankurah-core-types     = { path = "../../core-types", version = "=0.10.0", features = ["wasm"] }
ankurah-proto          = { path = "../../proto", version = "=0.10.0", features = ["wasm"] }
ankql                  = { path = "../../ankql", version = "=0.10.0" }
ankurah-storage-common = { path = "../common", version = "=0.10.0" }

wasm-bindgen = "0.2.84"
js-sys       = "0.3.69"
send_wrapper = "0.6.0"

tokio = { version = "1", features = ["sync"] }

anyhow       = "1.0"
thiserror    = "2.0"
bincode      = "1.3"
tracing      = "0.1"
async-trait  = "0.1"
futures-util = "0.3"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
ankurah           = { path = "../../ankurah", version = "=0.10.0", features = ["derive", "wasm"] }
serde             = { version = "1.0", features = ["derive"] }
