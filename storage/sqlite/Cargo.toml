[package]
name          = "ankurah-storage-sqlite"
version       = "0.10.0"
edition       = "2021"
description   = "Ankurah storage engine using SQLite"
license       = "MIT OR Apache-2.0"
documentation = "https://docs.rs/ankurah-storage-sqlite"
homepage      = "https://github.com/ankurah/ankurah"
repository    = "https://github.com/ankurah/ankurah"

[features]
# On wasm32, run the engine on Node.js's built-in node:sqlite. A native build
# ignores it and always runs on rusqlite.
node = ["dep:wasm-bindgen", "dep:js-sys", "dep:send_wrapper"]

[dependencies]
# The engine's own locks and once-cells, on every target
tokio = { version = "1", features = ["sync"] }

# Common dependencies - match other storage engines
anyhow       = "1.0"
thiserror    = "2.0"
bincode      = "1.3"
tracing      = "0.1"
async-trait  = "0.1"
futures-util = "0.3"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1"

# Ankurah workspace dependencies
ankql                  = { path = "../../ankql", version = "=0.10.0" }
ankurah-core           = { path = "../../core", version = "=0.10.0" }
ankurah-core-types     = { path = "../../core-types", version = "=0.10.0" }
ankurah-proto          = { path = "../../proto", version = "=0.10.0" }
ankurah-storage-common = { path = "../common", version = "=0.10.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# SQLite bindings with bundled SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# Connection pooling - match Postgres pattern
bb8 = "0.9"

# Async runtime - match workspace pattern
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ankurah-core       = { path = "../../core", version = "=0.10.0", features = ["wasm"] }
ankurah-core-types = { path = "../../core-types", version = "=0.10.0", features = ["wasm"] }
ankurah-proto      = { path = "../../proto", version = "=0.10.0", features = ["wasm"] }

# The node feature's driver: node:sqlite reached through wasm-bindgen
wasm-bindgen = { version = "0.2.84", optional = true }
js-sys       = { version = "0.3.69", optional = true }
send_wrapper = { version = "0.6.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile           = "3"
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }
ankurah            = { path = "../../ankurah", version = "=0.10.0", features = ["derive", "test-helpers"] }
tracing-subscriber = "0.3"
ctor               = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test    = "0.3"
wasm-bindgen-futures = "0.4"
ankurah              = { path = "../../ankurah", version = "=0.10.0", features = ["derive", "wasm", "test-helpers"] }
