name: Tests

on:
  pull_request:
    branches: [main, "release/**"]

jobs:
  release-scripts:
    name: Validate release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit --version 0.13.8 --locked

      - name: Run release script checks
        run: |
          ./release/tests/release-context.sh
          ./release/tests/bump-version.sh
          ./release/tests/publish.sh

  liaison:
    name: Verify README examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install liaison
        run: |
          curl -L -o /tmp/liaison https://github.com/dnorman/liaison/releases/download/v0.1.3/liaison-linux-amd64
          echo "6899799117b0f25c2b02555c83d486c278351c8c8e387674aeb6ffdec13af97f /tmp/liaison" | sha256sum -c
          chmod +x /tmp/liaison
          sudo mv /tmp/liaison /usr/local/bin/liaison

      - name: Verify code examples are up to date
        run: liaison --check README.md

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Docker is pre-installed on ubuntu-latest, but we need to start it
      - name: Start Docker service
        run: sudo systemctl start docker

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.3.7
        with:
          key: docker-${{ runner.os }}

      - name: Run tests
        run: cargo test
        env:
          RUST_BACKTRACE: 1

      # TODO: Re-enable once uniffi derive macro uses ::ankurah::uniffi:: path
      # - name: Run tests (uniffi)
      #   run: cargo test --features uniffi
      #   env:
      #     RUST_BACKTRACE: 1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # ankurah-storage-sqlite's suites on Node.js run in the sqlite-nodejs job.
      - name: Run WASM tests
        run: ./scripts/run-wasm-tests.sh browser
        env:
          RUST_BACKTRACE: 1

  sqlite-nodejs:
    name: SQLite on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ankurah-storage-sqlite's nodejs feature runs on a node:sqlite that
        # binds a numbered parameter at its position, which it checks as it
        # adopts a database: Node.js 22.20.0 or later on 22, 24.7.0 or later
        # on 24, and every later line. The matrix runs the oldest of those
        # releases on each of the LTS lines 22 and 24, and the newest release
        # of the newest line, 26.
        node: ["22.20.0", "24.7.0", "26"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run WASM tests on node:sqlite
        run: ./scripts/run-wasm-tests.sh storage_sqlite_node_sqlite
        env:
          RUST_BACKTRACE: 1

      # The same suite runs again on better-sqlite3, at the release
      # storage/sqlite/tests/package.json pins, on every leg: that release
      # ships prebuilt Node-API 10 binaries, which each leg's Node.js loads,
      # so `npm ci` builds nothing.
      - name: Install better-sqlite3
        working-directory: storage/sqlite/tests
        run: npm ci

      - name: Run WASM tests on better-sqlite3
        run: ./scripts/run-wasm-tests.sh storage_sqlite_better_sqlite3
        env:
          RUST_BACKTRACE: 1
