name: Publish Crates

on:
  push:
    branches: ["release/**"]
    # RELEASES changing is explicit publish intent. The version itself comes
    # from the lockstep Cargo manifests and is validated against the branch.
    paths: [RELEASES]

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

permissions:
  contents: write # Need to create and push tags

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run publish script
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./.release/publish.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Publishing failed. Check the logs above for details."
