name: Report CI status

# Posts each CI conclusion to the #ci room on community.ankurah.org
# (ankurah/community#66), so the project's build status is readable from chat
# without opening the Actions tab.
#
# WHICH RUNS ARE REPORTED. Every workflow here is gated on `pull_request`, so
# `main` itself is never built — a main-only filter would make #ci permanently
# silent. The rule instead is: report every failure, on any branch, plus the two
# headline workflows even when they pass. A green PR push therefore produces one
# line, and a broken one produces up to four. Benchmarks is deliberately absent:
# it is advisory and never fails, so it would be pure noise.
#
# RELEASE ANNOUNCEMENTS. Of everything this job reports, the conclusion a
# reader most wants to see is "a version just shipped". When the completed run
# is a successful Publish Crates on a `release/*` branch of this repository,
# the report also carries `release_version` and `release_notes`: the top line
# of the RELEASES file at the released commit — RELEASES is newest-first, so
# that line names the version this push shipped (the publish script separately
# guarantees the file holds exactly one entry for it). The community server
# renders a report bearing these fields as a release announcement instead of a
# plain status line (see server/src/ci_hook.rs there). Either side can deploy
# first: the server ignores fields it does not know, and a report without the
# fields still renders as the ordinary Publish Crates line.
#
# WHOSE CODE RAN. A pull request from a fork produces a run here, and
# `workflow_run` fires this job in THIS repository's context with this
# repository's secrets — while the fork chose the branch name, the commit, and,
# by whether its code compiles, the conclusion. Reporting `github.repository`
# for such a run would let anyone with a GitHub account put a line in #ci that
# reads exactly like ankurah/ankurah's own main going red, under a genuine
# github.com run link. So the reported repository is the HEAD repository — the
# one the code came from — marked as a fork whenever that is not this one. Fork
# runs are still reported, because a contributor's build breaking is worth
# seeing; what they cannot do is wear our name.
#
# AUTHENTICATION. The community endpoint has no login; a delivery proves itself
# by carrying an HMAC-SHA256 of its own raw body under a shared secret, in the
# svix header shape (see server/src/ci_hook.rs there). The secret lives in the
# COMMUNITY_CI_HOOK_SECRET Actions secret on this repo and in Secret Manager on
# the community side; both must hold the same value.
#
# INJECTION. Every field of the payload comes from the triggering run, and a
# branch name is whatever a contributor called it — including `$(…)` or a
# backtick. Those values are therefore passed through `env:` and never
# interpolated into the script body, which is what keeps a hostile branch name
# from executing here. The community server sanitizes them a second time before
# they reach message text.

on:
  workflow_run:
    workflows: [Tests, WASM Browser Tests, Format Check, Publish Crates]
    types: [completed]
  # A manual smoke test of the whole leg (signer → endpoint → #ci message)
  # without waiting for an organic run. Reports the dispatching ref as a
  # success.
  workflow_dispatch:

permissions: {}

jobs:
  report:
    name: Post the conclusion to community #ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion != 'success'
      || github.event.workflow_run.name == 'Tests'
      || github.event.workflow_run.name == 'Publish Crates'
    steps:
      - name: Sign and POST the report
        env:
          HOOK_URL: ${{ vars.COMMUNITY_CI_HOOK_URL || 'https://community.ankurah.org/hooks/ci' }}
          HOOK_SECRET: ${{ secrets.COMMUNITY_CI_HOOK_SECRET }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name || 'Manual smoke test' }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.run_attempt }}
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
        run: |
          set -euo pipefail
          # No `set -x` anywhere below: the secret is an argv away from the log.

          if [ -z "${HOOK_SECRET}" ]; then
            echo "::warning::COMMUNITY_CI_HOOK_SECRET is not set; skipping the #ci report."
            exit 0
          fi

          # Attribution: a run whose code came from a fork says so, so no
          # outsider's pull request can render as this repository's own build.
          # See WHOSE CODE RAN above.
          repo="${HEAD_REPO}"
          if [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            repo="${HEAD_REPO} (fork)"
          fi

          # See RELEASE ANNOUNCEMENTS above. The gate mirrors the publish
          # trigger — a push to release/* of THIS repository, so a fork's run
          # can never announce a release. The fetch is unauthenticated on
          # purpose: the repository is public and this workflow holds no
          # permissions. Any miss (file unreachable, top line not a version)
          # downgrades the message to a plain status line rather than failing
          # the report. The RELEASES line reaches the payload the same way
          # every other value does: a shell variable handed to jq as data,
          # never spliced into program text.
          RELEASE_VERSION=""
          RELEASE_NOTES=""
          if [ "${WORKFLOW}" = "Publish Crates" ] && [ "${CONCLUSION}" = "success" ] \
            && [ "${HEAD_REPO}" = "${BASE_REPO}" ]; then
            case "${BRANCH}" in
              release/*)
                releases=$(curl --silent --show-error --fail --max-time 30 \
                  "https://raw.githubusercontent.com/${BASE_REPO}/${SHA}/RELEASES") || releases=""
                line="${releases%%$'\n'*}"
                read -r version notes <<< "${line}" || true
                if printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                  RELEASE_VERSION="${version}"
                  RELEASE_NOTES="${notes}"
                fi
                ;;
            esac
          fi

          # jq builds the JSON so every value is escaped as data, whatever the
          # branch name contains. The release fields ride along only when the
          # gate above filled them.
          body=$(jq -nc \
            --arg repo "${repo}" \
            --arg workflow "${WORKFLOW}" \
            --arg branch "${BRANCH}" \
            --arg sha "${SHA}" \
            --arg conclusion "${CONCLUSION}" \
            --arg run_url "${RUN_URL}" \
            --arg run_id "${RUN_ID}" \
            --arg actor "${ACTOR}" \
            --arg release_version "${RELEASE_VERSION}" \
            --arg release_notes "${RELEASE_NOTES}" \
            '{repo:$repo,workflow:$workflow,branch:$branch,sha:$sha,conclusion:$conclusion,run_url:$run_url,run_id:$run_id,actor:$actor}
             + (if $release_version == "" then {} else {release_version:$release_version,release_notes:$release_notes} end)')

          # The delivery id is stable per (run, attempt, workflow), so a retry
          # of this job re-posts nothing: the server spends an id once.
          id="gh-${RUN_ID}-${RUN_ATTEMPT}"
          timestamp=$(date +%s)

          # The signed content is "<id>.<timestamp>.<raw body>", and the bytes
          # signed here must be the bytes sent below — hence `printf '%s'` and
          # `--data-binary`, neither of which adds a newline.
          signature=$(printf '%s.%s.%s' "${id}" "${timestamp}" "${body}" \
            | openssl dgst -sha256 -hmac "${HOOK_SECRET}" -binary \
            | base64 -w 0)

          # Retries cover the community service being briefly unreachable — a
          # revision rollout, a restart. They reuse the same id and timestamp, so
          # a retry after a response we never saw is deduplicated rather than
          # doubled.
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused \
            --request POST "${HOOK_URL}" \
            --header 'content-type: application/json' \
            --header "webhook-id: ${id}" \
            --header "webhook-timestamp: ${timestamp}" \
            --header "webhook-signature: v1,${signature}" \
            --data-binary "${body}")

          # A line starting `::` is a command to the Actions runner, not text, so
          # any run-supplied value echoed below is first stripped of the control
          # characters that could start one. The `workflows:` filter above
          # currently constrains these to a handful of literal names, which is a
          # constraint on the trigger rather than on this echo — the stripping is
          # what makes the echo safe on its own terms.
          safe_workflow=$(printf '%s' "${WORKFLOW}" | tr -d '\000-\037')
          safe_conclusion=$(printf '%s' "${CONCLUSION}" | tr -d '\000-\037')

          case "${status}" in
            2*)
              echo "Reported ${safe_workflow} (${safe_conclusion}) for ${repo} to #ci: $(cat response.txt)"
              ;;
            503)
              # The community server is up but has no CI_HOOK_SECRET yet. That
              # is their configuration to finish, not a fault in this run — warn
              # rather than paint ankurah's Actions tab red.
              echo "::warning::community #ci hook is not configured yet (503); nothing posted."
              ;;
            *)
              # 401 means the two sides hold different secrets; 4xx means this
              # payload is wrong. Both need a human.
              echo "::error::#ci report failed with HTTP ${status}: $(cat response.txt)"
              exit 1
              ;;
          esac
