[package]
name          = "ankurah-digest-tree"
description   = "Digest trees: sets kept in key order with a digest over every subtree, so two sets compare by their digests"
version       = "0.10.0"
edition       = "2021"
license       = "MIT OR Apache-2.0"
documentation = "https://docs.rs/ankurah-digest-tree"
repository    = "https://github.com/ankurah/ankurah"

[features]
default = []
# The disk-backed reference store, over raw sled.
sled = ["dep:sled"]
# Helpers for other crates' tests: building canonical keys, computing expected
# digests, and auditing a tree.
test-support = []

[dependencies]
# One lock per tree, held across awaits, on any async runtime.
async-lock = "3.4"
# std, the one default feature, builds for wasm32 and lets x86 builds choose
# their SIMD implementation at run time.
blake3 = "1.8.2"
# No default features: the digests need neither basepoint tables nor zeroizing.
curve25519-dalek = { version = "4.1.3", default-features = false }
# The Stream trait alone, which a scan of a view's members implements.
futures-core = "0.3"
serde        = { version = "1.0", features = ["derive"] }
sha2         = "0.10.8"
sled         = { version = "0.34", optional = true }
thiserror    = "2"

# Large builds hash their members on rayon's global pool; wasm32 hashes on the
# calling thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"

[dev-dependencies]
# Span digests cross the wire through serde: as bytes in bincode, and as a
# sequence in JSON, which has no byte strings.
bincode    = "1.3.3"
proptest   = { version = "1.11", default-features = false, features = ["std"] }
serde_json = "1.0"
# The sled reopen test needs a directory that outlives one database handle.
tempfile = "3.23"
# Top-level tests audit the trees they make, which the crate offers behind
# its test-support feature.
ankurah-digest-tree = { path = ".", features = ["test-support"] }
# The tests await the tree's operations.
tokio = { version = "1.40", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }
# The tests consume scans of a view's members with StreamExt and TryStreamExt.
futures = "0.3"

# criterion's default rayon feature refuses wasm32, and the benchmarks run natively.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

# harness = false because criterion provides its own harness. The digest
# benchmark measures hashing and digest arithmetic through the test-support
# helpers.
[[bench]]
harness           = false
name              = "digest"
required-features = ["test-support"]

[[bench]]
harness = false
name    = "tree"
